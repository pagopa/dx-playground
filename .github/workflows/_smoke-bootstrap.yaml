# Throwaway workflow: generates the lockfile the smoke test needs. The DX
# plugins live on GitHub Packages only, so the lockfile can only be produced by
# a runner that can authenticate to the registry, which is what is being tested.
name: Smoke bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          minimum_release_age: 7d

      - name: Authenticate to GitHub Packages
        uses: pagopa/dx/actions/setup-npm-registry@main
        with:
          token: ${{ github.token }}

      - name: Resolve the DX plugins
        run: |
          set -euo pipefail
          pnpm --version
          node --version
          pnpm -w add -D gh:@pagopa/nx-terraform gh:@pagopa/nx-docker

      - name: Upload the resolved workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lockfile
          path: |
            package.json
            pnpm-lock.yaml
            mise.lock
          if-no-files-found: warn
