name: Release Bootstrapper Infrastructure - dev
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/dev/**"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: bootstrapper-dev-cd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pagopa/dx/.github/actions/get-terraform-version@test/actions-hardening
        id: version
      - uses: pagopa/dx/actions/csp-login@test/actions-hardening
        id: login
        with:
          export-github-token: "false"
        env:
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
      - uses: pagopa/dx/.github/actions/terraform-setup@test/actions-hardening
        with:
          terraform_version: ${{ steps.version.outputs.terraform_version }}
      - name: Plan bootstrapper without applying changes
        working-directory: infra/bootstrapper/dev
        env:
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
          ARM_STORAGE_USE_AZUREAD: "true"
          GITHUB_TOKEN: ${{ steps.login.outputs.github-token }}
        run: |
          terraform init -input=false
          terraform plan -input=false -lock-timeout=120s -no-color
