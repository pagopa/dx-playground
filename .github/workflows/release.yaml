name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .nx/version-plans/**

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Nx Release
    uses: pagopa/dx/.github/workflows/release-v2.yaml@main
    permissions:
      contents: write
      id-token: write
      packages: write
      pull-requests: write
    with:
      environment: app-dev-cd
    secrets:
      app-client-id: ${{ secrets.GH_APP_RELEASE_CLIENT_ID }}
      app-private-key: ${{ secrets.GH_APP_RELEASE_APP_KEY }}
