name: Smoke control (no registry auth)

# Identical to .github/workflows/copilot-setup-steps.yml except that the
# "Authenticate to GitHub Packages" step is removed. It must fail, proving the
# auth step is what makes the install work.

on:
  pull_request:
    paths:
      - .github/workflows/_smoke-control.yaml

jobs:
  copilot-setup-steps:
    timeout-minutes: 59
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
          minimum_release_age: 7d

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
