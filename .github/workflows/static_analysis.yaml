name: Static Analysis

on:
  push:
    branches: [test/actions-hardening]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - infra/**
      - .terraform-version
      - .pre-commit-config.yaml
      - .trivyignore

permissions:
  contents: read
  pull-requests: write

jobs:
  tf_analysis:
    uses: pagopa/dx/.github/workflows/static_analysis.yaml@test/actions-hardening
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
