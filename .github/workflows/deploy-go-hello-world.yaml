name: Deploy Go Hello World Container App

on:
  workflow_dispatch:
    inputs:
      docker_image_tag:
        description: >-
          Existing image tag to redeploy without building or pushing. The
          deployed tag makes the release a revision no-op.
        type: string
        default: sha-6bf5b48
  push:
    branches:
      - main
    paths:
      - "apps/go-hello-world/**"
      - ".github/workflows/deploy-go-hello-world.yaml"

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

jobs:
  deploy:
    name: Deploy Go Hello World
    uses: pagopa/dx/.github/workflows/release-azure-containerapp-v1.yaml@test/actions-hardening
    secrets: inherit
    with:
      dockerfile_path: ./apps/go-hello-world/Dockerfile
      dockerfile_context: ./apps/go-hello-world
      docker_image_name: ${{ github.repository }}/go-hello-world
      docker_image_description: "Temporary Go hello world application"
      # Test branch only: main targets container-app-cc38/release-poc and the
      # dev-cd environment, none of which exist. These are the deployed ones.
      docker_image_tag: ${{ inputs.docker_image_tag }}
      container_app: dx-d-itn-playground-go-ca-01
      resource_group_name: dx-d-itn-github-runner-rg-01
      environment: app-dev
      enable_auto_deploy: false
