name: Hardening Validate v2

on:
  push:
    branches: [test/actions-hardening]
  workflow_dispatch:
  pull_request:
    paths: [infra/resources/**, nx.json, mise.toml]

permissions: {}

jobs:
  validate:
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    uses: pagopa/dx/.github/workflows/validate-v2.yaml@test/actions-hardening
    secrets:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_PUBLIC_ROLE_ARN: ${{ secrets.ECR_PUBLIC_ROLE_ARN }}
      GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
      GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
      GH_APP_KEY: ${{ secrets.GH_APP_KEY }}
      ROLE_ARN: ${{ secrets.ROLE_ARN }}
